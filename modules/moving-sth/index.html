<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y.Stage 4 - 定时搬化棒</title>
    <link rel="preload" as="image" href="/resource/images/bg_index.jpg" />
    <!-- P11：布局原语（L1 共享资产，origin 相对绝对路径）——先于 style.css，页面样式可覆盖 -->
    <link rel="stylesheet" href="/web/components/grid.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-overlay"></div>

    <!-- 浮动化棒容器 -->
    <div class="floating-sticks-container"></div>

    <div class="container">
      <header>
        <h1>定时搬化棒</h1>
        <p class="subtitle">计时器</p>
      </header>

      <main>
        <div class="game-container">
          <div class="timer-section">
            <div class="timer" id="timer">00:00</div>
            <div class="current-music">
              <span id="music-name">准备播放音乐...</span>
            </div>
            <!-- 布局：.grid-flow（auto-fit）宽屏一行 / 窄屏连续折行，零媒体查询 -->
            <div class="timer-controls grid-flow">
              <button id="start-timer-btn">开始</button>
              <button id="pause-timer-btn" disabled>暂停</button>
              <button id="reset-timer-btn">重置</button>
            </div>
          </div>

          <div class="time-setting">
            <span>限时：</span>
            <span id="time-limit">60</span>
            <span>秒</span>
          </div>
        </div>
      </main>

      <!-- 布局：.grid-flow（auto-fit）宽屏一行 / 窄屏单列，零媒体查询 -->
      <div class="navigation grid-flow">
        <button id="settings-btn">设置</button>
        <button id="back-btn">返回游戏中心</button>
        <button id="home-btn">返回主页</button>
      </div>

      <footer>
        <p>&copy; 2025 Y.Stage-X YUKAORI</p>
      </footer>
    </div>

    <div id="result-modal" class="modal">
      <div class="modal-content">
        <h2 id="result-title">时间到！</h2>
        <p id="result-message">计时结束</p>
        <div class="modal-buttons">
          <button id="try-again-btn">再试一次</button>
          <button id="back-to-menu-btn">返回菜单</button>
        </div>
      </div>
    </div>

    <audio id="game-music" class="hidden-audio"></audio>

    <!-- 前端插件挂载点（P4：页面 UI 由 /web/front.json 声明的 front/plugin.js 装配） -->
    <div id="plugin-root" hidden></div>

    <!-- 前端内核（ESM bundle：装配 front.json 插件 → ctx.ui.render） -->
    <script type="module" src="/web/kernel.js"></script>
  </body>
</html>
