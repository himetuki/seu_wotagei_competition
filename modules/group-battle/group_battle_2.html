<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{if(localStorage.getItem("ystage:theme")==="neon"){var h=document.documentElement;h.classList.add("theme-neon");var p=location.pathname.split("/");h.setAttribute("data-page",(p[1]==="m"&&p[2])?p[2].toLowerCase():"home");var a=function(i,u){if(!document.getElementById(i)){var s=document.createElement("link");s.id=i;s.rel="stylesheet";s.href=u;document.head.appendChild(s)}};a("theme-neon-css","/m/component-theme-neon/theme.css");a("theme-neon-layout-css","/m/component-theme-neon/neon-layout.css")}}catch(e){}</script>
    <title>团体赛 - 第二大轮</title>
    <link rel="preload" as="image" href="/resource/images/bg.jpg" />
    <!-- P11：布局原语（L1 共享资产，origin 相对绝对路径）——先于 style.css，页面样式可覆盖 -->
    <link rel="stylesheet" href="/web/components/grid.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" id="main-container">
      <header><h1>团体赛 - 胜者组/败者组</h1></header>
      <section id="status-section">
        <div id="bracket-status">第二大轮</div>
        <div id="system-hint">加载中...</div>
      </section>
      <!-- 布局原语 .grid-cards（/web/components/grid.css）：auto-fill 自适应列数，零媒体查询 -->
      <section id="groups-section">
        <div class="groups-grid grid-cards" id="groups-grid"></div>
      </section>
      <section id="music-info-section" class="hidden">
        <div class="music-info">
          <span class="music-info-label">抽到音乐</span>
          <span id="current-music-lib" class="music-info-track">-</span>
          <span id="current-music-source" class="music-info-source"></span>
        </div>
      </section>
      <section id="battle-arena" class="hidden">
        <div class="arena-vs">
          <div class="arena-player" id="arena-player1">
            <div class="arena-group-label" id="arena-group1-label">-</div>
            <div class="arena-player-name" id="arena-player1-name">?</div>
            <div class="arena-role" id="arena-role1">-</div>
          </div>
          <div class="vs-divider">VS</div>
          <div class="arena-player" id="arena-player2">
            <div class="arena-group-label" id="arena-group2-label">-</div>
            <div class="arena-player-name" id="arena-player2-name">?</div>
            <div class="arena-role" id="arena-role2">-</div>
          </div>
        </div>
      </section>
      <section id="actions-section">
        <div class="actions">
          <button id="draw-music-btn" class="hidden">抽取音乐</button>
          <button id="start-battle-btn" class="hidden">开始比赛</button>
          <button id="clear-winner-btn" disabled>撤消选择胜者</button>
          <button id="next-match-btn" class="hidden">进入下一场</button>
          <button id="reset-match-btn" class="hidden">重置当前对战</button>
          <button id="next-round-btn" class="hidden">进入第三大轮</button>
          <button id="prev-round-btn">撤回第一大轮</button>
        </div>
      </section>
      <section id="history-section">
        <h3 class="section-title">对战记录</h3>
        <div id="match-history"></div>
      </section>
      <section class="navigation">
        <button id="reset-game-btn">重置对战</button>
        <button id="home-btn">回到主页</button>
      </section>
      <footer><p>&copy; 2025 Y.Stage-X YUKAORI</p></footer>
    </div>
    <!-- P11-B5 组件插槽（组件宿主；必须放在 .container 之外：battle-mode 对 #main-container
         整棵子树施加 opacity:0，插槽若在其内会让遮罩/逐字文字/点击提示一并不可见）。
         battle-start 遮罩 / BATTLE START 逐字文本 / 停止提示三个骨架节点已删除，
         改由 component-music-player 以 overlay.enabled 自建（类名不变，CSS 继续生效）。 -->
    <div data-slot="music"></div>
    <div data-slot="draw"></div>

    <div id="anim-overlay" class="anim-overlay hidden"></div>
    <div id="kill-effect" class="kill-effect hidden">
      <div class="kill-text">ELIMINATED</div>
    </div>
    <div id="win-effect" class="win-effect hidden">
      <div class="win-text">VICTORY</div>
      <div class="crown"><!-- 皇冠图标由 front/plugin.js 注入内联 SVG（原 emoji 已移除） --></div>
    </div>
    <audio id="music-player"></audio>

    <div id="plugin-root" hidden></div>
    <script type="module" src="/web/kernel.js"></script>
  </body>
</html>
