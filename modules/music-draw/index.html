<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直接抽取音乐</title>
  <link rel="preload" as="image" href="/resource/images/bg.jpg" />
  <!-- P11：布局原语（L1 共享资产，origin 相对绝对路径）——先于 style.css，页面样式可覆盖 -->
  <link rel="stylesheet" href="/web/components/grid.css" />
  <link rel="stylesheet" href="/m/component-toast/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="main-container">
    <header>
      <h1>直接抽取音乐</h1>
    </header>

    <section id="music-section" class="grid-cards">
      <!-- 1yearminus 曲库 -->
      <div class="music-group">
        <h2>1年-曲库</h2>
        <div class="music-info" id="music-info-1yearminus">未抽取</div>
        <div class="button-group">
          <button id="draw-1yearminus-btn" class="draw-btn">抽取音乐</button>
          <button id="battle-1yearminus-btn" class="battle-btn" disabled>比赛开始</button>
        </div>
      </div>

      <!-- 1yearplus 曲库 -->
      <div class="music-group">
        <h2>1年+曲库</h2>
        <div class="music-info" id="music-info-1yearplus">未抽取</div>
        <div class="button-group">
          <button id="draw-1yearplus-btn" class="draw-btn">抽取音乐</button>
          <button id="battle-1yearplus-btn" class="battle-btn" disabled>比赛开始</button>
        </div>
      </div>

      <!-- 1yearplus_ex 曲库 -->
      <div class="music-group">
        <h2>四强赛曲库</h2>
        <div class="music-info" id="music-info-1yearplus-ex">未抽取</div>
        <div class="button-group">
          <button id="draw-1yearplus-ex-btn" class="draw-btn">抽取音乐</button>
          <button id="battle-1yearplus-ex-btn" class="battle-btn" disabled>比赛开始</button>
        </div>
      </div>
    </section>

    <section class="navigation">
      <button id="home-btn">回到主页面</button>
    </section>

    <footer><p>&copy; 2025 Y.Stage-X YUKAORI</p></footer>
  </div>

  <!-- P11 组件插槽（每曲库一对：music-player / draw-machine）。组件宿主必须放在
       #main-container 之外——比赛模式对 #main-container 施加 opacity:0 + visibility:hidden，
       插槽若在其内会让遮罩/打字动画/退出提示一并不可见。空容器，无视觉影响。 -->
  <div data-slot="music-1yearminus"></div>
  <div data-slot="draw-1yearminus"></div>
  <div data-slot="music-1yearplus"></div>
  <div data-slot="draw-1yearplus"></div>
  <div data-slot="music-1yearplus-ex"></div>
  <div data-slot="draw-1yearplus-ex"></div>

  <!-- 前端插件挂载点（P4：页面 UI 由 /web/front.json 声明的 front/plugin.js 装配） -->
  <div id="plugin-root" hidden></div>

  <!-- 前端内核（ESM bundle：装配 front.json 插件 → ctx.ui.render） -->
  <script type="module" src="/web/kernel.js"></script>
</body>
</html>
