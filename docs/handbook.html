<script type="text/markdown" id="md-getting-started">
> 《Y.Stage3 手册》章节 · 读者：现场使用者与开发者
> 插件开发请进阶阅读 [插件开发教程](#tutorial) 与 [插件开发技术参考](#plugin-development)。

## 1. 项目是什么

Y.Stage3 是 WOTA 艺（荧光棒舞蹈）对战平台：管理选手、技能、音乐，支持一年加组、一年内组、团体赛、Drag 对阵树等赛制。

架构一句话：**万物皆插件**。每个功能模块 = 一对插件（后端 `plugin.js` + 前端 `front/plugin.js`）+ 三份清单条目；页面仍是独立页面 `/m/<id>/`，由服务端（Node 内置 http + 自研 y-router + cordis 插件内核）与前端内核（`/web/kernel.js`）分别装配。**新增功能不需要修改任何共享代码。**

## 2. 现场使用者（便携包）

1. 从 Release 下载 `YStage3-Portable.zip`，解压到一个**专用文件夹**
2. 双击 `启动YStage.bat`，浏览器访问 <http://localhost:3000>
3. 首次运行会自动生成缺失的 `resource/` 目录结构
4. 用完关闭窗口即可

> 端口 3000 被占用时自动改用 3001、3002……，并在窗口打印实际地址，访问打印出的地址即可。

**停止与自检**：

- 正常退出：`Ctrl+C`，或在终端输入 `q` / `exit`
- 数据自检：输入 `t` / `test`，确认本机能否正常读写数据库（**重要比赛前建议在备用电脑也跑一遍**）

## 3. 开发者环境（源码运行）

```bash
npm install          # 安装依赖
npm run build        # 构建内核产物（server/cordis/kernel.cjs + web/dist/kernel.js，均 gitignored）
node server.js       # 启动，控制台出现 [cordis] 装配完成 即成功
```

- 克隆或换新环境后**必须先 `npm run build`**——内核产物不入库，缺它启动会快速失败并给出修复指引
- 数据自检：启动后终端输入 `t`；开发测试入口 `node server.js --test`（跑完自动退出，exit 0）
- 装配自检：`node server.js --test-cordis`（插件装配断言 A1-A6）
- 单元测试：`node server/run-unit-tests.js`

## 4. 数据在哪

全部运行数据都在 `resource/` 文件夹（SQLite 数据库、音乐库、json 快照、图片）。**备份 = 复制整个 `resource/` 文件夹**，详见[日常使用](#usage)。

<script type="text/markdown" id="md-usage">
> 《Y.Stage3 手册》章节 · 现场使用者必读。

## 1. 首次启动后的数据导入

程序自带空数据启动后，选手、技能、音乐等全部在**网页界面**里导入，通常不需要直接编辑文件：

- **导入选手**：主页 → 设置中心 → 选手管理。支持 txt 批量导入：文件一行一个选手名字，后缀 `.txt`，无需分隔符
- **导入技能**：设置中心 → 技能管理
- **导入奖励**：设置中心 → 奖励管理
- **导入音乐**：设置中心 → 音乐管理，或"音乐导入"页面批量导入；也可以直接把音乐文件放进 `resource/musics/<组别目录>`（如 `1yearplus`、`1yearminus`、`1yearplus_ex`、`games_musics`、`musics_free`），再刷新页面

> 音乐文件格式建议 mp3 / wav，文件名尽量避免特殊字符。

## 2. 一场比赛怎么跑

1. **赛前准备**：在设置中心导入选手、技能、音乐；打开各赛制页面确认数据正确
2. **抽签/编排**：在赛制页面（一年加组 / 一年内组 / 团体赛 / Drag 式）完成分组与对阵
3. **抽取音乐**：点击"抽取音乐"，随机滚动结束后确认曲目
4. **开始比赛**：点击"开始比赛"播放音乐，进入比赛模式；双击任意位置可停止播放
5. **判定胜负**：比赛结束后点击胜者，系统自动计分并推进轮次
6. **查看结果**：比赛结束后到排名、排行榜、团体排名页面查看成绩
7. **备份数据**：比赛结束后复制整个 `resource/` 文件夹保存

## 3. 备份与恢复

- 全部数据都在 `resource/` 文件夹里（选手、赛程、SQLite 数据库、音乐）
- **备份**：复制整个 `resource/` 文件夹即可
- **恢复**：把备份的 `resource/` 放回程序同目录，覆盖同名文件即可
- **重要比赛前**：请备份，并在备用电脑上跑一遍 `t` 自检

## 4. 功能页面 404 了？

可能该插件被停用了。到 `/m/plugin-manager/` 查看状态并重新启用即可；停用不影响已保存的数据（详见[插件管理](#plugin-manager)）。
</script>

<script type="text/markdown" id="md-plugin-manager">
> 《Y.Stage3 手册》章节 · 面向管理员；面向开发者的管理面实现见[插件开发技术参考](#plugin-development)。

## 1. 它是什么

管理页本身也是一个插件（这是本项目"界面插件化"的示范），提供全部模块的可视化管理：**不修改代码、不重启服务**即可启停功能、编辑配置、热重载。

## 2. 操作与生效时机

| 操作 | 效果 |
|------|------|
| 启用/停用后端插件 | **即时生效**：其路由与页面物理 404（请求排空保证在途请求安全完成），SQLite 数据保留 |
| 编辑 config | 写入清单并热重装，即时生效 |
| 热重载 | 改盘上的插件文件后无需重启即生效 |
| 前端插件开关 | 落盘后**刷新页面**生效 |

## 3. 语义细节

- **停用不丢数据**：SQLite 数据完整保留，重新启用即恢复
- **请求排空**：热重载瞬间，正在保存的比赛进度会安全完成；新请求会短暂收到 503（自动重试即可），比赛进行中热重载正在使用的模块属于低风险操作，但仍建议避开
- **便携包内**：所有改动写入 `plugins/` 目录下的真实清单文件，**重启后保持**
- **清单即事实**：手动编辑 `plugins/plugins.json` / `front.json`（或 dev 模式的 `server/plugins.json` / `web/front.json`）与在页面上操作等效

## 4. 常见操作

- 某个赛制页 404？→ 到管理页确认该插件是否被停用，重新启用即可
- 改了某插件的代码？→ 管理页对该插件"重载"，无需重启
- 想临时隐藏某个功能？→ 停用它，数据不丢，随时恢复

<script type="text/markdown" id="md-tutorial">
> 《Y.Stage3 手册》章节 · 面向开发者。本篇是上手导览；**API 签名、参数、清单结构、生命周期与错误语义的完整技术细节**见姊妹篇 [插件开发技术参考](#plugin-development)。

## 1. 心智模型

一个功能 = **一对插件 + 三份清单条目**：

```
modules/my-feature/
├── plugin.js          # 后端插件（CommonJS）：路由 + 数据库 + 页面元数据
├── index.html         # 页面：静态骨架（可选）+ #plugin-root + /web/kernel.js
├── style.css
└── front/
    ├── plugin.js      # 前端插件（原生 ESM）：注册页面组件
    └── view*.js       # 组件实现（可拆多文件，同目录相对 import）
```

三份清单（脚手架会自动追加，**不要手改**）：

| 清单 | 作用 | 漏掉的后果 |
|------|------|-----------|
| `modules/modules.json` | 页面元数据（导航/管理页显示名单） | 页面能跑但不进导航 |
| `server/plugins.json` | 后端装配 | 路由与页面 404 |
| `web/front.json` | 前端装配 | 页面空白、前端代码不下载 |

`enabled:false` = 不挂载但数据保留；未列出 = 不挂载。

## 2. 准备

- 能跑 `node server.js` 且控制台无 error（见[快速上手](#getting-started)）
- 起服后访问 `/m/plugin-manager/`，确认现有插件全部"已挂载"——这是你的基线环境
- 选定模块 id：**小写字母 + 连字符**（如 `music-draw`），它同时是目录名、页面路径、前端组件 key

## 3. 第一步：脚手架（永远从它开始）

```bash
node scripts/new-module.js my-feature "我的功能"            # 纯前端模块
node scripts/new-module.js my-feature "我的功能" --server   # 带后端（附 db + 路由模板）
```

脚手架生成一对插件骨架（含中文契约注释）并**自动追加三份清单条目**。三份清单不同步是本项目最经典的坑，用脚手架可完全避免。

## 4. 后端插件（`plugin.js`，CommonJS）

```js
module.exports = {
  name: "my-feature",
  inject: ["db", "server", "modules"],   // 白名单：server / db / modules / assembly
  apply(ctx) {
    // ---- 数据库：一行声明即得持久化文档 ----
    ctx.db.define([
      { name: "my-feature-process", defaultValue: { phase: "idle" } },
    ]);
    // ctx.db 还有 get(name) / sql(q, p) / exists(name)

    // ---- 路由：必须在 apply 同步窗口内注册；一律带路径前缀 ----
    ctx.server.route((app, { dbManager, serverLog, dataDir }) => {
      app.get("/api/my-feature/ping", (req, res) => res.json({ ok: true }));
      app.post("/api/my-feature-process", (req, res) => { /* 保存进度 */ });
    });

    // ---- 页面元数据：必须与 modules.json 中本模块条目逐字段一致 ----
    ctx.modules.registerPage({
      id: "my-feature", name: "我的功能", description: "一句话说明",
      icon: "puzzle",                         // 图标名，须 ∈ web/icons.mjs 的 ICON_NAMES
      nav: ["select"], order: 50,             // nav: "index"/"select"/"games"
    });

    // ---- 卸载清理：插件停用时从导航中消失 ----
    ctx.effect(() => () => ctx.modules.unregister("my-feature"));
  },
};
```

**三条纪律：**

1. `inject` 只能写白名单服务名，**拼错会导致装配挂起**（内核会校验跳过，但别依赖兜底）
2. 路由全部经 `app.get/post(...)` 带**路径前缀**注册——**禁止 `scope.use(fn)` 无路径中间件**（热重载排空按路径模式拦截，pathless 层无锚点）
3. 数据库名与 API 前缀保持对应（`my-feature-process` ↔ `/api/my-feature-process`）

## 5. 前端插件（`front/plugin.js`，原生 ESM）

```js
export default {
  name: "my-feature-front",
  inject: ["ui", "api"],                 // 白名单：ui / api / state
  apply(ctx) {
    ctx.ui.register({
      key: "my-feature",                 // ★ 必须 = 模块 id，内核按它渲染
      component(el, meta, ctx2) {        // el = #plugin-root；meta = 清单条目 config
        const controller = new AbortController();
        el.innerHTML = `<section class="my-feature-page">
          <button id="my-feature-btn">点我</button>
        </section>`;
        el.querySelector("#my-feature-btn")
          .addEventListener("click", onClick, { signal: controller.signal });

        return () => controller.abort(); // cleanup：重渲染/卸载前被调用
      },
    });
  },
};
```

**铁约定：**

- **所有事件监听都传 `{ signal }`**，cleanup 里统一 `abort()`——违反它，插件重渲染时会双绑双触发
- `apply` 阶段只 register，**DOM 操作统一发生在 component 被调用时**（内核装配完成后）
- 页面内资源用同目录相对路径（`style.css`、`./front/...`）；共享资源用绝对路径（`/api/...`、`/resource/...`、`/web/...`），**不要写死 localhost 或端口**
- 服务可用 `ctx.api.get/post/del`（自动 JSON 序列化，非 2xx 抛错带 status）；跨插件通信用 `ctx.state` + `state:changed` 事件

### 5.1 图标（`/web/icons.mjs`）

全项目 UI 图标统一来自共享基座 `web/icons.mjs`（Tabler Icons 本地内置子集，MIT，离线可用、运行期零依赖；许可见根 `THIRD-PARTY-NOTICES.md`）。前端插件里 origin 相对路径 import，不要自建图标字典：

```js
import { icon, iconEl } from "/web/icons.mjs";

// 装饰性图标（旁边有文字）——不停用屏幕阅读器
btn.innerHTML = `${icon("plus", { size: 18 })}<span>新增选手</span>`;

// 图标即唯一语义——必须给 label
cell.append(iconEl("trash", { label: "删除该行" }));

// 颜色跟随父元素（stroke="currentColor"，无需在 JS 指定颜色）
statusEl.innerHTML = icon("circle-check", { size: 16 }) + " 已保存";
```

- `icon(name, { size = 20, class, stroke = 1.75, label })` → SVG 字符串；`iconEl(name, opts)` → 真实 `SVGElement`
- `label` 有值渲染 `role="img"` + `aria-label`，无值渲染 `aria-hidden="true"`；未知图标名 `icon()` 返回 `""`、`iconEl()` 返回 `null`（占位安全，不抛错）
- **禁止 emoji 图标、禁止内联复制 SVG path**；缺图标时把准确 path 追加进 `web/icons.mjs` 的 `ICON_PATHS`，再跑 `node web/icons.test.js` 守门
- 模块元数据的 `icon` 字段填**图标名**（`ICON_NAMES` 成员，如 `puzzle`），不是 emoji

## 6. 组件与共享库（什么时候该写组件）

页面代码里反复出现的交互（抽签动画、音乐播放）不要各页重写——按 **L1/L2 分层**沉淀，判据是**有没有生命周期**：

| 层 | 落位 | 准入 | 引入方式 |
|----|------|------|----------|
| L1 共享资产 | `web/lib/*.mjs`、`web/components/compose.mjs`、`web/components/grid.css` | 纯函数/纯样式：无监听、无定时器、无网络、无模块级可变状态；必须配 `*.test.js` | 直接 `import`（origin 相对路径），不注册插件、不进清单 |
| L2 组件类插件 | `modules/component-<名>/`（仅 `front/{plugin,view}.js`） | 有生命周期（监听/定时器/网络/多媒体）且被 **≥2 个页面**复用 | 进 `web/front.json`（`kind:"component"` + `pages`），享受 `enabled:false` 禁用与热开关 |

现有 L1 资产：`/web/lib/random.mjs` 的 `shuffle/pickN/pickOne`（等概率随机，替代有偏洗牌）、`/web/lib/persist.mjs` 的 `createPersistence`（双写持久化）、`/web/lib/undo.mjs` 的 `createUndoStack`（撤销栈）、`/web/components/compose.mjs` 的 `mountFromConfig`（页面装配器）、`/web/components/grid.css`（零媒体查询布局原语 `.grid-cards` / `.grid-flow` / `.grid-split` / `.card`）。现有 L2 组件：`music-player`（音乐播放 + 比赛模式）、`draw-machine`（抽签动画）。

组件表 API 共三个（`ctx.ui`）：`registerComponent(name, factory)`、`component(name)`（→ `factory | null`）、`listComponents()`——组件插件被 `enabled:false` 禁用后 `component(name)` 返回 `null`，页面据此降级。

### 6.1 脚手架（组件模式）

```bash
node scripts/new-module.js my-widget "我的组件" --component --pages drag,music-draw
```

组件 id 自动补 `component-` 前缀，只生成 `front/{plugin,view}.js` + `web/front.json` 条目（**不生成** `index.html` / `style.css` / 后端 `plugin.js`）。组件名 = `registerComponent` 的公开标识（kebab-case），页面侧按名字取用。

### 6.2 页面侧取用（最小范例，含降级）

```js
import { mountFromConfig } from "/web/components/compose.mjs";

// 页面 component 内（el 即 #plugin-root）：
const bridge = { draw: null };            // 组件 props.onReady 回填的实例 API，页面 flow 消费
const mounted = mountFromConfig({
  el, meta, ctx,
  label: "my-feature",                    // 日志前缀
  defaultSlots: { "draw-machine": "[data-slot=draw]" },
  runtimeProps: { "draw-machine": { onReady: (api) => { bridge.draw = api; } } },
});

// 或命令式只取一个组件——组件被 enabled:false 禁用时返回 null，必须降级不崩：
const factory = ctx.ui.component("draw-machine");
if (factory) mounted.cleanups.push(factory(host, props, ctx));
```

`mountFromConfig` 返回 `{ cleanups, mountAll(), cleanup() }`：`cleanup()` 逆序卸载全部已实例化组件（单个抛错不影响其余），与页面 flow 的 cleanup 一起在页面卸载时调用。**组件缺失、插槽缺失、选择器非法一律 warn 后跳过——插槽留空、页面照常工作。**

### 6.3 `front.json` 声明（页面条目 `config`）

```json
{
  "target": "modules/my-feature",
  "enabled": true,
  "config": {
    "compose": ["draw-machine"],
    "slots": { "draw-machine": "[data-slot=draw]" },
    "components": { "draw-machine": { "ticks": 15, "tickMs": 80 } }
  }
}
```

| 键 | 语义 |
|----|------|
| `compose` | 需要装配的组件名，**顺序 = 挂载顺序**；缺省 = `slots` 的键 |
| `slots` | 组件宿主选择器，**键是组件名**；值为字符串 = 单实例 |
| `components` | 组件静态 props（时序/颜色/文案）；运行时 props（页面 `view.js` 提供）浅合并优先 |

**多实例**：`slots` 的值写成数组（多个宿主选择器），`components` 的值写成数组，**按实例下标一一对应**（数组取第 i 项；`components` 传对象则所有实例共用同一份）。范例：`modules/music-draw/` 三曲库 = 3 个 `music-player` + 3 个 `draw-machine`，宿主用 `data-slot="music-1yearminus"` 之类的短名承载。

组件的完整 API 签名、装配器参数（`runtimeProps` / `names` 条件装配）、`kind` / `pages` 清单字段与组件纪律，见[插件开发技术参考](#plugin-development) §3.8 与 §4.1。

## 7. 页面与静态骨架

`index.html` 最小骨架：

```html
<body>
  <div id="plugin-root"></div>
  <script type="module" src="/web/kernel.js"><\/script>
</body>
```

也可以像 `modules/drag/` 那样把完整静态骨架（控制条、音频元素等）直接写进 HTML，组件只负责绑定既有 DOM 与渲染动态内容——改动更小、样式零回归，复杂页面推荐此法。多页面模块（如 `moving-sth` 的设置页）每页都放内核标签，前端组件内按 DOM 标记分发。

## 8. 持久化双写模板（赛制类模块）

前端保存采用 **localStorage + 服务器双写**，服务器失败静默跳过（比赛现场网络抖动不丢进度）；恢复时先服务器后本地：

```js
const API_URL = "/api/my-feature-process";      // origin 相对路径

function saveState() {
  localStorage.setItem("myFeatureState", JSON.stringify(data));
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...data, lastUpdate: new Date().toISOString() }),
  }).catch(() => {});
}
// 恢复链：loadStateFromServer() 失败 → loadLocalState() → 都没有则 initNewGame()
```

同类重复代码已沉淀成 L1 共享库：`createPersistence`（双写/恢复链/重置）、`createUndoStack`（撤销栈）、`shuffle/pickN/pickOne`（随机抽取）——新页面优先 import 它们，别再手写一遍（签名见[插件开发技术参考](#plugin-development) §3.8）。

## 9. 生命周期：挂载、停用、热重载

- **挂载**：内核按清单装配，register 后按 key 渲染
- **停用**：物理生效——后端路由与页面 404、前端代码不再下载；**SQLite 数据保留**，重新启用即恢复
- **热重载**：改盘上的插件文件 → 管理页点"重载"→ 请求排空（在飞请求安全完成后切换）→ require 缓存逐出 → 新代码生效，**全程无需重启**
- 前端插件开关：落盘后刷新页面生效（组件类插件同理——`enabled:false` 时不被任何页面加载）

## 10. 命名约定

| 类别 | 规则 | 示例 |
|------|------|------|
| 模块目录 | 小写+连字符 | `modules/music-draw/` |
| 组件类插件目录 | `component-<组件名>` | `modules/component-music-player/` |
| 后端/前端插件文件 | 固定名 | `plugin.js` / `front/plugin.js` |
| API 端点 | `/api/{功能前缀}-{资源}` | `/api/drag-process` |
| 数据库名 | 与 API 前缀对应 | `drag-process` |
| localStorage key | 功能+描述 | `dragBattleState2_player1` |
| CSS class / HTML id | 小写+连字符 | `.node-box`、`draw-music-btn` |
| JS 变量/函数 | camelCase | `drawMusic` |
| 组件名 | 小写+连字符（`registerComponent` 的公开标识） | `music-player`、`draw-machine` |
| 图标名 | 小写+连字符，须 ∈ `ICON_NAMES` | `home`、`device-gamepad-2` |

## 11. 验证清单（每步都要实际跑）

- [ ] 重启 `node server.js`，控制台 `[cordis] 装配完成` 且无 error
- [ ] 访问 `/m/my-feature/` 正常渲染；`/m/plugin-manager/` 中本插件"已挂载"无 error
- [ ] 管理页**停用再启用**：路由/页面 404 后恢复，数据不丢
- [ ] 刷新页面、二次进入，无重复渲染、无控制台红错
- [ ] 用到了组件时：管理页前端 tab 禁用该组件插件 → 刷新页面，插槽留空但页面照常工作（降级不崩）
- [ ] `node scripts/endpoint-diff.js --compare` 全绿（不破坏既有 HTTP 行为基线）

## 12. 实例索引（按需照抄）

| 实例 | 学什么 |
|------|--------|
| `modules/select/` | 最小后端插件：纯页面元数据注册 |
| `modules/drag/` | 完整范式：数据库 + 路由 + 复杂前端 + 静态骨架绑定 + cleanup |
| `modules/setting/` | 多文件前端聚合（set-*.js → front/view.js） |
| `modules/moving-sth/` | 多页面模块（游戏页 + 设置页，DOM 标记分发） |
| `modules/plugin-manager/` | 管理面：assembly 服务、config 机制、页面本身即可替换插件 |
| `modules/component-music-player/` | L2 组件范例：音乐播放 + 比赛模式归一（`body` class 引用计数、宿主 audio 只 pause 不删） |
| `modules/component-draw-machine/` | L2 组件范例：抽签/闪现动画归一（定时器登记、回调式结果交付、等概率 `pickOne`） |
| `modules/music-draw/` | 多实例接入范例：三曲库 = 3 个 `music-player` + 3 个 `draw-machine`（数组槽位按下标一一对应） |
| `web/components/compose.mjs` | L1 装配器实现：`mountFromConfig` 的降级 / props 合并 / 多实例下标语义（配 `compose.test.js`） |

## 13. 常见坑

1. **三份清单不同步**——用脚手架，别手改
2. **inject 拼写错误** → fiber 挂起（内核校验后跳过并报 error，去管理页看）
3. **`scope.use(fn)` 无路径中间件** → 热重载排空失效，禁止
4. **监听不传 `{ signal }`** → 重渲染双绑，事件触发两次
5. **写死 `localhost:3000`** → 换环境即坏，一律 origin 相对路径
6. **改了内核/共享设施** → 后果自负；一切功能自包含于 `modules/<id>/`（唯一例外：缺图标时向 `web/icons.mjs` 追加 path）
7. **用 emoji 或自绘/粘贴 SVG 当图标** → 多份事实来源必然漂移；统一走 `web/icons.mjs` 的 `icon()` / `iconEl()`
8. **组件内模块级可变状态** → 页面同时挂载同一组件多个实例时串台（音乐播放器 P0 缺陷根因）；状态只放工厂调用的局部变量
9. **给 `document.body` 加 class 未成对移除** → 组件可能被中途卸载，残留 class 污染后续页面；同页多实例共享 body 类时用引用计数，最后一个退出者才移除
10. **多实例共享宿主 `<audio>` 不校正 `src`** → "点 A 的按钮播 B 的歌"；启动前按当前结果校正，且宿主 audio 只 pause/归零、绝不删除
11. **`[data-slot]` 宿主放在 `opacity:0` 祖先里** → 比赛模式播放器不可见；插槽宿主必须在 opacity 作用域之外
12. **组件 import 其他组件** → 单个组件禁用会级联崩溃；组件之间保持零依赖

---

出包与分发见[打包与发布](#packaging)；更多文档见[文档索引](./README.md)。
</script>

<script type="text/markdown" id="md-plugin-development">
> 本文是插件开发的**完整技术参考**：API 签名、参数、数据结构、生命周期与错误语义。
> 入门教程见 [插件开发教程](#tutorial)；架构总览见 `AGENTS.md`。

## 1. 插件形态总览

### 1.1 目录结构（一个模块的全部文件）

```
modules/<模块id>/
├── plugin.js            # 后端插件（CommonJS，必须）
├── index.html           # 页面（必须）：静态骨架 + #plugin-root + 内核标签
├── style.css            # 样式（可选，页面同目录相对引用）
└── front/
    ├── plugin.js        # 前端插件（原生 ESM，必须）
    └── view*.js         # 组件实现（可选拆分，同目录相对 import）
```

加载方式：

| 文件 | 加载者 | 方式 |
|------|--------|------|
| `plugin.js` | 服务端 cordis loader | `require(磁盘绝对路径)`（参与真实 `require.cache`，热重载可逐出） |
| `index.html` / `style.css` | y-router 的 `/m/:id/*` 静态服务 | HTTP |
| `front/plugin.js` 及其 import 图 | 浏览器内核 loader | `import("/m/<id>/front/plugin.js")` 动态导入（`enabled:false` 不下载） |

### 1.2 导出形状对照

| | 后端 `plugin.js` | 前端 `front/plugin.js` |
|---|---|---|
| 模块格式 | CommonJS（`module.exports =`） | 原生 ESM（`export default`） |
| 必填字段 | `apply(ctx)` | `apply(ctx)` + 注册的 `key` |
| 可选字段 | `name`、`inject`、`Config` | `name`、`inject` |
| `inject` 白名单 | `server` `db` `modules` `assembly`（+ 清单 `provides` 声明） | `ui` `api` `state` |
| 运行环境 | Node（服务进程内） | 浏览器（页面内） |
| 不可 import | 不得绕过内核直接 require 服务端模块 | 不得 import 内核文件或 Node 模块 |

### 1.3 装配流程（谁在什么时候调用你）

**后端**：进程启动 → 读 `server/plugins.json` → 创建根 Context → provide 内置服务（`server/db/modules/assembly`，在任何业务插件挂载之前）→ 按清单顺序 `await ctx.plugin(wrapped)` → `initializeAllDatabases()` → 挂共享路由 → listen。

**前端**：页面加载 `/web/kernel.js` → 从 `location.pathname` 解析模块 id → `fetch("/web/front.json")` → 过滤 `enabled !== false` 且 target 匹配的条目 → 建前端 root、provide `ui/api/state` → 逐个 `await import(...)` + `ctx.plugin()` → 全部完成后 emit `kernel:ready` → 对当前模块 id 调 `ui.render`。

### 1.4 组件类插件形态（L2，P11）

组件类插件是**纯前端资产**：没有 `index.html`、没有后端 `plugin.js`，也不进 `modules/modules.json` / `server/plugins.json`、不进导航；只在 `web/front.json` 有一条 `kind:"component"` 条目。

```
modules/component-<名>/
├── front/
│   ├── plugin.js     # 组件注册（原生 ESM）：ctx.ui.registerComponent("<名>", factory)，inject 仅需 ["ui"]
│   └── view.js       # 组件工厂：factory(hostEl, props, ctx) => cleanup|void
└── style.css         # 可选；组件不自带 <link>，需要时由页面按 /m/component-<名>/style.css 引入
```

| | 页面插件 | 组件类插件 |
|---|---|---|
| 注册 API | `ctx.ui.register({ key, component })` | `ctx.ui.registerComponent(name, factory)` |
| 注册表 | 页面表（key 必须 = 模块 id） | 组件表（name 自由命名，建议 kebab-case） |
| 自动渲染 | kernel 按 URL 自动 `render` | **永不自动渲染**，只在页面 component 显式 `ctx.ui.component(name)` 取用时实例化 |
| 清单条目 | `web/front.json` + `modules.json` + `plugins.json` | **仅** `web/front.json`：`{ kind: "component", pages: [...] }` |
| 资源放行 | 由页面模块条目决定 | `kind:"component"` 且 `enabled !== false` 是 `/m/component-*/**` 可被静态服务的**白名单依据**（`server/routes/module-routes.js` 的 `resolveComponentDir`，fail closed：禁用即不服务） |

跨页命中：`pages` 决定被哪些页面加载（`web/loader.mjs` 的 `matchPage`，缺省 = 只匹配 target 自身 id）；`enabled:false` 不 import、前端代码不下载。

## 2. 后端插件 API

### 2.1 导出契约

```js
module.exports = {
  name: "my-feature",              // string，可省略（loader 以清单 target 的 id 兜底）
  inject: ["db", "server", "modules"], // array 或单个 string（如 "db"），可省略
  // Config: <StandardSchemaV1>,   // 可选：声明后清单 config 会先过校验
  apply(ctx, config) { /* ... */ },
};
```

| 字段 | 类型 | 说明 |
|------|------|------|
| `name` | `string` | 插件名；省略时以 `plugins.json` 条目 target 的 id 兜底 |
| `inject` | `string \| string[]` | 依赖的服务名。**不在白名单内的名字 → 该插件被跳过挂载，计入 errors，serverLog 报 error，不阻断启动**（防止 cordis fiber 永久 PENDING 死锁） |
| `Config` | StandardSchema | 可选 config 校验器；不声明时清单条目的 `config` 原样透传 |
| `apply` | `(ctx, config) => void` | 插件主体。**`ctx.server.route()` 必须在 apply 的同步窗口内完成调用**（loader 顺序 await 保证单变量 scope 无交错） |

白名单集合 = 内置 `{ server, db, modules, assembly }` ∪ `server/plugins.json` 各条目 `provides: [...]` 声明的服务名。插件间依赖：先行插件在清单声明 `provides` 并 `ctx.provide(name, value)`，后行插件 inject 该名字。

### 2.2 `ctx.server`

```js
ctx.server = {
  app,                                 // y-router 实例（createApp 产物）
  route(cb),                           // 注册进 per-plugin 路由 scope
  log(...args),                        // 等价 serverLog
};
```

**`route(cb)`**：`cb = (app, { dbManager, serverLog, dataDir }) => void`，在回调内同步完成全部路由注册。

| 参数/成员 | 说明 |
|-----------|------|
| `app` | 路由注册面：`app.get/post/put/delete(path, handler...)`、`app.use(path, subRouter)`；handler 为 Connect 风格 `(req, res, next)`，支持中间件数组与 4 参错误处理 `(err, req, res, next)` |
| `dbManager` | 数据库管理器（同 `ctx.db` 的底层，供原 Express 时代代码直迁） |
| `serverLog` | 结构化日志函数：`serverLog(msg, level?)`，level 可为 `"error"` 等 |
| `dataDir` | 数据目录绝对路径（`resource/` 的解析结果，便携模式随 env 变化） |

**scope 语义**（理解热插拔的关键）：

- 每次 `route()` 的注册进入名为 `plugin:<id>` 的 scope；插件卸载 = `removeScope` **物理删除**这些路由层（后续请求立即 404），不是逻辑屏蔽
- 卸载前执行**请求排空**：该 scope 标记 draining → 命中其路由的新请求得到 `503 {"error":"plugin <id> is reloading"}` + `Retry-After: 1` → 在飞请求全部完成后才 dispose（超时 `Y_STAGE_DRAIN_TIMEOUT_MS`，默认 15000ms，强制降级并告警）
- 重挂（reload/改 config）时层序自动修正：新路由层会被搬回 404 兜底之前的正确位置（K16），`/api/modules` 投影顺序保持不变（K17）
- 同一插件的管理操作按 id **promise 链串行化**：并发 toggle/reload 不会交错出"三态不一致"

**禁止事项**：`scope.use(fn)`（无路径中间件）——排空按路径模式拦截，pathless 层无锚点（当前内核已防御：pathless 层不参与拦截匹配，但作为约定仍禁止）。

### 2.3 `ctx.db`

```js
ctx.db = {
  define(defs),          // defs: [{ name: string, defaultValue: object }]
  get(name),             // → lowdb v1 兼容文档对象
  sql(q, params),        // 原生 SQL 查询
  exists(name),          // → boolean
};
```

| API | 参数 | 返回/行为 |
|-----|------|-----------|
| `define(defs)` | `[{ name, defaultValue }]` | 声明模块数据库。`INSERT OR IGNORE` 幂等；默认值**不覆盖**已有数据（优先读 docs 行）。装配早于建库时仅登记，统一初始化时补写 |
| `get(name)` | 数据库名 | lowdb v1 兼容对象：`getState()` / `setState(obj)` / `write()` / `set(path, val)` / `push(path, val)` 链式可用（`.set().set().write()` 为合法用法） |
| `sql(q, params)` | SQL 语句 + 参数 | 直查 SQLite |
| `exists(name)` | 数据库名 | 是否已存在 |

存储位置：`resource/sqlite/y-stage.sqlite`（单文件，sql.js WASM 引擎，无需安装数据库）。插件停用/卸载**不删数据**。

### 2.4 `ctx.modules`

```js
ctx.modules = {
  registerPage(page),    // 注册页面元数据
  unregister(id),        // 注销（从 /api/modules 与导航中消失）
  list(),                // 当前全部页面投影
  get(id),               // 单条查询
};
```

**`registerPage(page)`** 参数（7 字段，与 `modules/modules.json` 中本模块条目**逐字段一致**——selfcheck A3 双源 parity 断言把关）：

| 字段 | 类型 | 说明 |
|------|------|------|
| `id` | `string` | 模块 id（= 目录名 = 前端组件 key） |
| `name` | `string` | 显示名 |
| `description` | `string` | 一句话说明 |
| `icon` | `string` | 图标名，必须是 `web/icons.mjs` 的 `ICON_NAMES` 成员（如 `trophy`），不是 emoji |
| `nav` | `string[]` | 出现在哪些导航页：`"index"` / `"select"` / `"games"` 的子集；`[]` 不进导航 |
| `order` | `number` | 导航内排序，小在前 |

投影时自动补 `route: "/m/<id>/"`。**必须**配套 `ctx.effect(() => () => ctx.modules.unregister(id))`，保证停用后从 `/api/modules` 消失。

### 2.5 `ctx.assembly`（管理面服务，一般只有 plugin-manager 使用）

```js
ctx.assembly = {
  status(),                    // → { manifest, fibers, errors, baseOrder, baseLayerCount, ... }
  toggle(id, enabled),         // → { ok, persisted }  启停（排空→dispose→按需重挂）
  reload(id),                  // → { ok }             require.cache 逐出 + 重挂
  setConfig(id, config),       // → { ok, persisted }  写清单 config + 热重装
  toggleFront(id, enabled),    // → { ok, persisted }  写 web/front.json（前端插件，刷新生效）
};
```

`persisted:false` 仅在清单文件不可写时出现（通用写权限警示）。自保护：对 plugin-manager 自身执行禁用/重载/改 config 一律 400。

### 2.6 HTTP 处理器环境（垫片语义）

handler 写法与 Express 子集一致，由 `server/http/shim.js` 提供。**能用与不能用的**：

| 类别 | 支持 | 说明 |
|------|------|------|
| `res` 链式 | `res.status(n).set(k,v).type(mime).json(obj).send(body).end()` | `send(string)` → `text/html; charset=utf-8`；`send(Buffer)` 保型；`redirect(url)` 带 `Vary: Accept` 协商 |
| `req` | `req.params`（**URL 解码**）、`req.query`、`req.path`（**保持原始编码**——注意与 params 的不对称是 Express 语义）、`req.originalUrl`、`req.body`、`req.headers` | `:param` 路径参数 + `*` 通配 + 尾斜杠宽容匹配 + 大小写不敏感 |
| 全局中间件 | `cors`（最先，预检 204）、`body-parser`（JSON，limit 5MB）、`multer`（50MB，仅音乐上传路由） | 直接 `next(e)` |
| 错误处理 | `next(err)` → 4 参错误分发 → 穷尽后 500 JSON | malformed JSON → 500 |
| 明确不存在 | ETag/304、自动 OPTIONS 应答（无 Origin 裸 OPTIONS 落 404）、`res.sendFile/download/cookies/render`、`express.static` | 静态文件走共享层；需要发文件用 `res.send(Buffer)` 或流 |
| 404 兜底 | JSON/文本形式 `Cannot <METHOD> <path>` | 依赖 `req.originalUrl` |

### 2.7 生命周期与卸载语义

```
apply(ctx) 同步窗口
  └─ ctx.server.route() 注册 → scope "plugin:<id>"
停用（toggle off / 清单移除）
  ├─ 标记 draining：命中本插件路由的新请求 → 503 + Retry-After: 1
  ├─ 等在飞请求归零（Y_STAGE_DRAIN_TIMEOUT_MS，默认 15000，超时强制降级并 warn）
  └─ dispose（cordis effect 逆序回收）→ scope 路由物理移除 → 后续 404（正确语义）
重载（reload / 改 config）
  └─ 同上排空 → require.cache 逐出该插件的磁盘文件 → 重新 require + apply
     → 重挂期间微窗口内原路径请求 503（而非 404）→ finally resumeScope
```

约束：同一插件对象重复 `ctx.plugin()` 会叠加 fiber（cordis K2）——loader 已防，插件作者无需处理但**不要在模块顶层做有副作用的单例注册**；`fiber.dispose()` 是异步的（K6），loader 全程 await。

## 3. 前端插件 API

### 3.1 导出契约

```js
export default {
  name: "my-feature-front",     // string，可省略
  inject: ["ui", "api"],        // 白名单：ui / api / state；可省略或传单个 string
  apply(ctx) {
    ctx.ui.register({ key: "my-feature", component });
  },
};
```

- **`key` 必须 = 模块 id**：内核装配完成后按 `location.pathname` 解析出的 id 调 `ui.render`，key 不匹配则页面显示"插件未启用"占位
- `inject` 含未知服务名 → 该插件被跳过（防 cordis fiber PENDING 死锁），错误计入装配 errors
- 插件文件**不要 import 内核**（`/web/kernel.js`）或任何 Node 模块；需要拆分就用同目录相对 import（`./view.js`）

### 3.2 `ctx.ui`

```js
ctx.ui = {
  // ---- 页面表（kernel 按 URL 自动渲染；key 必须 = 模块 id）----
  register({ key, component }),
  unregister(key),
  render(key, meta, container),
  // ---- 组件表（P11：页面显式取用，永不被 kernel 自动渲染）----
  registerComponent(name, factory),
  component(name),        // → factory | null
  listComponents(),       // → string[]（插入序快照）
};
```

| API | 参数 | 行为 |
|-----|------|------|
| `register` | `key: string`；`component: (el, meta, ctx) => cleanup \| void` | 注册页面组件。`el` = 容器元素（`#plugin-root`）；`meta` = front.json 条目的 `config`（缺省 `null`）；`ctx` = 前端 Context（`ctx.on/emit` 可用） |
| `unregister` | `key` | 注销并触发其 cleanup |
| `render` | `key, meta, container` | 未注册 → 渲染占位 `<div class="plugin-placeholder">插件未启用…</div>`；重复 render **先调用旧 cleanup**；组件抛错 → 捕获、降级渲染占位并 console.error（不会白屏） |
| `registerComponent` | `name: string`（建议 kebab-case）；`factory: (hostEl, props, ctx) => cleanup \| void` | 注册组件工厂；同 name **后注册覆盖先注册**；name 非字符串/空串或 factory 非函数 → 抛错 |
| `component` | `name` | 返回工厂本体；未注册或非字符串名 → **`null`**（调用方据此优雅降级，不抛错） |
| `listComponents` | — | 已注册组件名的**插入序快照**（防御性拷贝，调试/管理页/单测断言用） |

**两张表互不覆盖**：页面表 key = 模块 id（kernel 按 URL 查表 render），组件表 name 自由命名、**永不被 kernel 自动渲染**。本期不提供 `unregisterComponent`——组件生命周期 = 页面生命周期（`front.json` 的 enabled 决定是否 import，热替换 = 刷新页面），刷新即重建整个 ctx。

**cleanup 契约**：返回的函数在"同容器再次 render"或"unregister 当前 key"时被调用（抛错被吞并 console.error，不阻断新渲染）。事件监听一律 `addEventListener(type, handler, { signal })` + `AbortController`，cleanup 里 `abort()`；定时器/rAF/audio 也应在 cleanup 中清理。组件实例的 cleanup 由取用方持有与释放（见 3.8 的 `mountFromConfig`）。

### 3.3 `ctx.api`

```js
ctx.api = {
  get(path),            // → Promise<解析后的 JSON>
  post(path, body),     // body 自动 JSON.stringify + Content-Type
  del(path),
};
```

- `path` 一律 **origin 相对路径**（`/api/...`）——部署到任意端口/子路径无需改代码
- 非 2xx：抛 `Error`，`err.status` 为状态码（前端按需 try/catch）
- 纯文本响应回退为 `{ text }` 形态

### 3.4 `ctx.state`

```js
ctx.state = {
  get(key),          // → any
  set(key, val),     // 广播 ctx.emit("state:changed", { key, val })
};
```

跨插件内存键值。监听：`ctx.on("state:changed", (payload) => {...})`。

### 3.5 事件

| 事件 | 载荷 | 时机 |
|------|------|------|
| `kernel:ready` | `{ moduleId }` | 全部插件挂载完成后、`ui.render` 之前 |
| `state:changed` | `{ key, val }` | `ctx.state.set` 时 |
| `plugins.updated` | 装配快照 | 后端管理操作成功后（预留事件，当前无前端订阅者） |

### 3.6 页面结构（`index.html`）

最小形态：

```html
<body>
  <div id="plugin-root"></div>
  <script type="module" src="/web/kernel.js"><\/script>
</body>
```

三种形态：

1. **全组件**：页面内容全部由 component 构建（适合简单页面）
2. **静态骨架 + 绑定**（复杂页面推荐，参考 `modules/drag/`）：HTML 写完整骨架与 CSS 引用，component 只绑定既有 DOM（用 `document.getElementById`）并渲染动态内容——样式零回归
3. **多页面模块**（参考 `modules/moving-sth/`）：每个 HTML 都含内核标签，component 内按 DOM 标记分发（如 `#settings-form` → 设置页逻辑），`front.json` 只需一条

模块 id 解析规则（`web/loader.mjs` 的 `moduleIdFromPath`）：`/m/<id>/…` → `<id>`；`/` 与 `/index.html` → `home`；其余 → null（不装配）。

### 3.7 图标基座 `web/icons.mjs`

全项目 UI 图标的唯一来源：Tabler Icons 的本地内置子集（MIT，`@tabler/icons` v3.46.0 outline，构建期一次性提取，运行期零依赖、无 CDN、无网络请求）。来源与许可全文见仓库根 `THIRD-PARTY-NOTICES.md`。

```js
import { icon, iconEl, ICON_NAMES } from "/web/icons.mjs";
```

| API | 参数 | 返回/行为 |
|-----|------|-----------|
| `icon(name, opts?)` | `name` 图标名；`opts = { size?, class?, stroke?, label? }` | 内联 SVG **字符串**。`size` 默认 20、`stroke` 默认 1.75（非法/非正数回退默认）、`class` 追加且基础类 `y-icon` 恒保留。**未知名字返回 `""`**（占位安全，不抛错） |
| `iconEl(name, opts?)` | 同上 | 真实 `SVGElement`（经 `<template>` 构造）；无 DOM 环境（node 单测）或未知名字返回 `null` |
| `ICON_NAMES` | — | 已内置图标名（冻结数组，当前 61 枚，字典序）；模块 `icon` 字段必须取自这里 |

无障碍语义：`label` 有值 → `role="img"` + `aria-label`（图标是唯一语义来源时用）；无值 → `aria-hidden="true"`（装饰性，旁边已有文字说明）。`label` / `class` 中的引号与尖括号会被属性转义。

```js
import { icon, iconEl } from "/web/icons.mjs";

// ① 装饰性图标（旁边有文字）——不停用屏幕阅读器
btn.innerHTML = `${icon("plus", { size: 18 })}<span>新增选手</span>`;

// ② 图标即唯一语义——必须给 label
cell.append(iconEl("trash", { label: "删除该行" }));

// ③ 颜色跟随父元素（stroke="currentColor"，无需在 JS 指定颜色）
statusEl.innerHTML = icon("circle-check", { size: 16 }) + " 已保存";
```

约定与边界：

- **禁止新增 emoji 图标**，**禁止在模块内自建图标字典或内联复制 SVG path**——图标只有 `web/icons.mjs` 一份事实来源。CSS 伪元素 `content:"…"` 无法承载图标，改由真实 DOM 节点（`icon()` 输出）承载。
- **缺失图标**：把准确的 Tabler path 追加进 `web/icons.mjs` 的 `ICON_PATHS`（键自动并入 `ICON_NAMES`），然后跑 `node web/icons.test.js`；该测试校验需求清单、SVG 统一规格、边界行为，并扫描 `modules/**` 中引用本基座的文件、报告缺失图标名。
- 模块元数据 `registerPage({ icon })` 与 `modules/modules.json` 的 `icon` 填图标名（`ICON_NAMES` 成员），两处必须一致（见 2.4）。

### 3.8 L1 共享资产与页面装配器（P11）

**L1 分层**：纯函数/纯样式共享资产（与 `web/icons.mjs` 同级）——无生命周期、不进清单、可直接 import（origin 相对路径），必须配 `*.test.js`。

| 资产 | 导出 | 说明 |
|------|------|------|
| `/web/lib/random.mjs` | `shuffle(arr, rng?)`、`pickN(arr, n, rng?)`、`pickOne(arr, rng?)` | 等概率随机（`shuffle` 为 Fisher–Yates，**替代有偏的 `sort(() => Math.random() - 0.5)`**）；均返回新数组、不改入参，入参非数组按空数组处理（不抛错）；`rng` 默认 `Math.random`（注入固定序列可做确定性测试）；`pickN` 长度 = `min(max(floor(n),0), arr.length)`，`pickOne([])` → `null` |
| `/web/lib/persist.mjs` | `createPersistence(deps)`、`createMemoryStorage()` | 教程 §8 双写持久化模板的依赖注入实现（`key` 必填）；`deps = { key, storage?, api?, endpoint?, clearEndpoint?, initNewGame?, isValid?, now?, onError? }` |
| `/web/lib/undo.mjs` | `createUndoStack(opts?)`、`MAX_HISTORY`（= 50） | 撤销快照栈：`push/undo/peek/canUndo/size/clear/toArray/load`；超上限丢最旧（FIFO），快照按引用保存 |
| `/web/components/grid.css` | `.grid-cards` / `.grid-flow` / `.grid-split` / `.card` | 布局原语：**零媒体查询**（`repeat(auto-*, minmax(min(<阈值>,100%),1fr))` 按容器宽度连续自适应）；`.grid-cards` 用 auto-fill（卡片尺寸一致）、`.grid-flow` / `.grid-split` 用 auto-fit（少卡片时撑满） |
| `/web/components/compose.mjs` | `mountFromConfig(spec)` | 页面组件装配器（见下） |

`createPersistence` 返回 `{ load, save, reset }`（均为 Promise，**永不 reject**）：

- `load()` → `{ data, source }`，`source: "server" | "local" | "new" | "none"`；恢复链 server → localStorage → `initNewGame`
- `save(data)` → `{ local, remote }`（两端各自是否成功）；本地先写（同步必达），远端 POST 体 = `{ ...data, lastUpdate: now() }`（`data` 为数组/原始值时按原值发）
- `reset()` → `{ local, remote }`；只清两端存档、不重建状态

**`mountFromConfig(spec)`** —— 消除页面插件里"读 front.json config → 查 `ctx.ui.component` → 挂到 `data-slot` 宿主 → 收集 cleanup"的重复样板：

```js
import { mountFromConfig } from "/web/components/compose.mjs";

const mounted = mountFromConfig({
  el,               // 页面根容器（#plugin-root）
  meta,             // front.json 中该页面条目的 config（可 null）
  ctx,              // 前端 ctx（内部只用 ctx.ui.component(name)）
  label,            // 日志前缀，如 "music-draw"（warn/error 消息带 [label]）
  defaultSlots,     // 缺省插槽表 { "<组件名>": "[data-slot=x]" | [sel, ...] }；清单 config.slots 覆盖/追加
  runtimeProps,     // 可选：运行时 props，按组件名索引（对象 = 单/共用；数组 = 多实例按下标）
  names,            // 可选：只装配这些组件（与推导出的 compose 取交集、保持其顺序；[] = 本页零装配）
});
// → { cleanups, mountAll(), cleanup() }
```

| 返回成员 | 语义 |
|----------|------|
| `cleanups` | 已实例化组件的 cleanup 数组（按挂载顺序；调用方也可自行 push 页面 cleanup） |
| `mountAll()` | 执行一次装配循环（构造时已自动执行一次）；**非幂等**：重复调用会在同一宿主再建一个实例并追加 cleanup，旧的监听、`body` class 等副作用需先 `cleanup()` 释放，**切勿当作"重渲染"使用** |
| `cleanup()` | **逆序**调用 cleanups 并清空；单个抛错不影响其余（console.error 上报，不向外抛） |

清单声明语义（`meta`，即 front.json 页面条目的 `config`）：

| 键 | 值 | 语义 |
|----|----|------|
| `compose` | `["music-player","draw-machine"]` | 需要装配的组件名，**顺序 = 挂载顺序**；缺省 = `Object.keys(slots)` |
| `slots` | `{ "<组件名>": "[data-slot=x]" \| ["sel1","sel2"] }` | 宿主选择器（**键 = 组件名**）；数组 = 多实例。`slots = { ...defaultSlots, ...meta.slots }`——模块缺省表兜底，清单可覆盖/追加 |
| `components` | `{ "<组件名>": { …props } \| [{ … }, …] }` | 静态 props；数组 = 多实例按下标一一对应，对象 = 所有实例共用 |

- 宿主查找顺序：`el.querySelector(selector) || document.querySelector(selector)`
- props 优先级：静态 props < 运行时 props（浅合并）；多实例按**实例下标一一对应**取（`propsAtIndex` 语义）
- 只有 `factory(host, props, ctx)` 返回函数才入 cleanups
- `names` 诊断：不在 compose/slots 推导结果中的名字逐条 warn `[<label>] names 中的组件 "<name>" 不在 compose/slots 中，已忽略` 并忽略（不装配、不查组件表）；`names: []` = 本页零装配且零告警（movement-teaching 记录页/设置页依赖此路径），缺省 `names` 或非数组畸形值均不过滤、零告警
- 组件自带样式：`style.css` 属**可选兜底外观**（组件不自带 `<link>`）——需要组件独立外观、或宿主页无对应 CSS 时，由页面显式引入 `<link rel="stylesheet" href="/m/component-<名>/style.css">`；未引入不影响功能，组件与页面共用既有类名（如 `battle-overlay` / `rolling` / `selected`），现有 8 个接入页的外观均由各自页面 CSS 提供

**优雅降级（装配器自身的畸形输入不抛错）**：`ctx.ui.component(name)` 未注册（组件被 `enabled:false` 禁用）→ factory 为 null → warn 后跳过该组件（插槽留空），页面其余部分照常工作；槽位未声明、宿主不存在、选择器非法（非字符串 / DOM 拒收）、`meta` / `slots` / `components` / `runtimeProps` 畸形（null、数组、原始值）一律 warn 后跳过或按空表降级。组件工厂 `factory(host, props, ctx)` 自身抛错**不**被吞掉（**向上传播**，降级归调用方），以免掩盖组件真实缺陷。

**组件纪律（P11 实战教训）**：监听传 `{ signal }` + AbortController；`body` class 成对增删（多实例共享时引用计数）；禁模块级可变状态（多实例串台根因）；宿主 audio 只 pause/归零、不删除；`[data-slot]` 宿主置于 `opacity:0` 祖先之外；`config` 只放静态值；**组件不得 import 其他组件**（禁用会级联崩溃）。

参考实例：单实例 `modules/drag/front/plugin.js`、多实例 `modules/music-draw/front/plugin.js`、条件装配 `modules/movement-teaching/front/plugin.js`（`names` 传 `[]` 表达"本页零装配"）。

## 4. 结构参考

### 4.1 三份清单

**`server/plugins.json`**（后端装配）：

```json
{
  "provider": { "server": "y-router", "db": "sqlite" },
  "plugins": [
    { "target": "modules/drag", "enabled": true,
      "config": { "totalCount": 12 },
      "provides": [] }
  ]
}
```

| 字段 | 必填 | 说明 |
|------|------|------|
| `target` | ✔ | `"modules/<id>"` |
| `enabled` |  | 默认 true；`false` = 不挂载（路由/页面 404，SQLite 数据保留） |
| `config` |  | 透传为 `apply(ctx, config)` 第二参（声明了 `Config` schema 则先校验） |
| `provides` |  | 本插件向其他插件提供的服务名数组（并入 inject 白名单动态集合） |

**`web/front.json`**（前端装配）：

```json
{
  "provider": { "ui": "dom" },
  "plugins": [
    { "target": "modules/drag", "enabled": true,
      "config": { "keepBg": true },
      "pages": ["drag", "performance"] },
    { "target": "modules/component-draw-machine", "enabled": true,
      "kind": "component",
      "pages": ["drag", "music-draw", "movement-teaching"] }
  ]
}
```

| 字段 | 说明 |
|------|------|
| `enabled` | `false` = 不 import，**前端代码不下载**（效果等同没有该 script） |
| `config` | 作为 `component(el, meta)` 的 `meta` 传入；页面条目用它声明组件装配（`compose` / `slots` / `components`，见 3.8） |
| `pages` | 可选；覆盖默认的"target 即本模块页"匹配，用于跨页插件 |
| `kind` | 组件类插件填 `"component"`——既是分类标记，也是服务端放行 `/m/component-*/**` 静态资源的**白名单依据**（`resolveComponentDir` 要求 `kind === "component"` 且 `enabled !== false`，fail closed；见 1.4） |

组件类插件条目**只存在于 `web/front.json`**（不进 `modules/modules.json` / `server/plugins.json`、不进导航）；组件目录含 `index.html` 也无意义——kernel 不会自动渲染组件名。

**`modules/modules.json`**（页面元数据）：`{ "modules": [ { id, name, description, icon, nav, order } ] }`——与后端插件 `registerPage` 逐字段一致（脚手架自动双写），其中 `icon` 为 `web/icons.mjs` 的 `ICON_NAMES` 图标名。

损坏容错：后端清单 JSON 损坏 → 整体回退 legacy 投影 + serverLog error，服务器照常启动；前端清单获取失败 → 按空清单装配（页面渲染占位，不白屏）。

### 4.2 `/api/modules` 投影结构

```json
{ "id": "drag", "name": "Drag式比赛", "description": "对阵树式四强双败赛",
  "icon": "trophy", "nav": ["select"], "order": 15, "route": "/m/drag/" }
```

固定 7 字段、顺序 = modules.json 宇宙序（插件注册按 id 原位覆盖，不沉底）。

### 4.3 `/api/plugins` 快照结构（管理页数据源）

```json
{ "backend": [ { "id", "name", "icon", "kind": "plugin|legacy", "enabled", "mounted", "error", "config" } ],
  "front":   [ { "id", "name", "icon", "enabled", "kind" } ] }
```

前端条目的 `kind` 是可选的分类元数据（P11 增量）：组件类插件为 `"component"`，普通页面条目为 `null`。`pkg` 单文件形态退役后（P6b）快照不再返回该字段。

便携模式（`Y_STAGE_PLUGINS_DIR` / `Y_STAGE_RESOURCE_DIR` 环境变量注入）下清单即 `plugins/` 目录的真实文件，所有写操作 `persisted: true`。

---

## 5. 错误语义与边界

| 场景 | 行为 |
|------|------|
| 后端 inject 含未知服务 | 跳过挂载、errors 收集、serverLog error，其余插件照常装配 |
| `apply` 抛错 | fiber dispose，已注册的 scope effect 被回收（路由随插件消失），errors 收集 |
| 前端插件 import 失败 / apply 抛错 | errors 收集，继续装配后续插件；页面渲染占位 |
| component 抛错 | render 捕获 → 占位降级 + console.error |
| 坏 JSON 请求体 | 500（4 参错误分发穷尽兜底） |
| 热重载排空超时 | 强制 dispose + warn（在飞请求可能失败，有界降级） |
| 清单写盘失败（只读目录） | 响应 `persisted:false` + 通用写权限警示，内存态本次进程内仍生效 |

---

> 《Y.Stage3 手册》章节 · 面向负责出包与分发的同学。

## 1. 一键打包

```bat
build.bat
```

等价于：构建内核产物（`npm run build`）→ `node scripts/make-portable.js --zip` → 产出 `YStage3-Portable/` 目录与同名 zip。解压即用，无需安装 Node。

`make-portable.js` 支持 `--out <目录>`（自定义输出位置）、`--zip`（打压缩包）、`--no-resource`（不带数据目录）。

## 2. 便携包布局（三层分离）

```
YStage3-Portable/
├── node/       # Node 运行时（复制构建机的 node.exe，可与应用分别升级）
├── app/        # 应用核心（bundle 形态：server.bundle.cjs + sql-wasm.wasm + web/ 整树；整体替换即升级）
├── plugins/    # ★ 插件组件层：两份清单 + 全部模块代码（可写、可热替换）
├── resource/   # 数据层：sqlite/、musics/、json/、images/
├── 启动YStage.bat
└── 说明.txt
```

- `plugins/` 与 `resource/` 在升级应用时**原地保留**——选手数据、比赛进度、自定义配置不丢失
- 启动脚本通过 `Y_STAGE_PLUGINS_DIR` / `Y_STAGE_RESOURCE_DIR` 环境变量把插件层与数据层指向外置目录，**清单与 config 的改动即时落盘、重启保持**
- `app/web/` 是**整树复制**（含 `dist/` 内核产物与 `icons.mjs` 等共享前端资产，排除 `*.test.js` 与 `front.json`），而不是只带 `dist/`——保证便携包内 `/web/icons.mjs` 等共享资产可达

## 3. 插件热替换（无需重新出包）

1. 直接修改 `plugins/` 下的文件（改 `modules/<id>/plugin.js` 逻辑、增删模块目录）
2. 打开 `/m/plugin-manager/` 对该插件**热重载**——改盘即生效
3. 新增模块：在 `plugins/plugins.json` 追加条目后重启；前端插件在 `plugins/front.json` 加条目

## 4. GitHub Actions 自动发布

`.github/workflows/package.yml`：推送 `v*` 标签或手动触发即可自动构建，产出 `YStage3-Portable.zip` 工件并随 Release 发布。

> 跨平台提示：便携包内的 node.exe 取自构建机，Windows 包需在 Windows 上构建；如需 macOS/Linux 分发，在对应系统上执行 `node scripts/make-portable.js` 即可。

<script>
"use strict";
/* ── 迷你 Markdown 渲染器 + 手册导航（自包含，无外部依赖） ── */
const CHAPTERS = [
  { id: "intro",             title: "导读",           file: null,                   src: "md-intro" },
  { id: "getting-started",   title: "快速上手",        file: "./getting-started.md", src: "md-getting-started" },
  { id: "usage",             title: "日常使用",        file: "./usage.md",           src: "md-usage" },
  { id: "plugin-manager",    title: "插件管理",        file: "./plugin-manager.md",  src: "md-plugin-manager" },
  { id: "tutorial",          title: "插件开发教程",    file: "./tutorial.md",        src: "md-tutorial" },
  { id: "plugin-development",title: "插件开发参考",    file: "./plugin-development.md", src: "md-plugin-development" },
  { id: "packaging",         title: "打包与发布",      file: "./packaging.md",       src: "md-packaging" },
];

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function mdToHtml(src) {
  const codeBlocks = [];
  src = src.replace(/```([^\n`]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    codeBlocks.push({ lang: lang.trim(), code: code.replace(/\n$/, "") });
    return "\n\u0000B" + (codeBlocks.length - 1) + "\u0000\n";
  });
  const codeBlockHtml = (b) =>
    `<div class="codeblock"><div class="codebar"><span>${esc(b.lang) || "代码"}</span>` +
    `<button class="copy">复制</button></div><pre><code>${esc(b.code)}</code></pre></div>`;

  const inline = (s) => {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000"; });
    s = esc(s);
    if (/^\[ \]/.test(s)) s = "☐ " + s.slice(4);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) =>
      u.startsWith("#") ? `<a href="${u}">${t}</a>`
                        : `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    s = s.replace(/\u0000C(\d+)\u0000/g, (m, ix) => `<code>${esc(codes[+ix])}</code>`);
    return s;
  };

  const lines = src.split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const cb = line.match(/^\u0000B(\d+)\u0000$/);
    if (cb) { html += codeBlockHtml(codeBlocks[+cb[1]]); i++; continue; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { const n = Math.min(h[1].length + 1, 5); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (/^(---+|\*\*\*+)\s*$/.test(line)) { html += "<hr>"; i++; continue; }
    if (line.startsWith("> ")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith("> ")) { buf.push(inline(lines[i].slice(2))); i++; }
      html += `<blockquote>${buf.join("<br>")}</blockquote>`; continue;
    }
    if (line.startsWith("|") && lines[i + 1] && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      const cells = (l) => l.replace(/^\||\|\s*$/g, "").replace(/\\\|/g, "\u0001")
                            .split("|").map((c) => inline(c.replace(/\u0001/g, "\\|").trim()));
      const head = cells(line); i += 2;
      const body = [];
      while (i < lines.length && lines[i].startsWith("|")) { body.push(cells(lines[i])); i++; }
      html += '<div class="tablewrap"><table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join("") +
        "</tr></thead><tbody>" +
        body.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>";
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)/);
        if (!m) break;
        const text = inline(m[3]);
        if (m[1].length === 0 || !items.length) items.push({ html: text, sub: [] });
        else items[items.length - 1].sub.push(text);
        i++;
      }
      html += `<${tag}>` + items.map((it) =>
        `<li>${it.html}${it.sub.length ? `<${tag}>` + it.sub.map((s) => `<li>${s}</li>`).join("") + `</${tag}>` : ""}</li>`
      ).join("") + `</${tag}>`;
      continue;
    }
    if (line.trim() === "") { i++; continue; }
    html += `<p>${inline(line)}</p>`; i++;
  }
  html = html.replace(/\u0000B(\d+)\u0000/g, (m, ix) => codeBlockHtml(codeBlocks[+ix]));
  return html;
}

const nav = document.getElementById("nav");
const content = document.getElementById("content");
const chTitle = document.getElementById("ch-title");
const chFile = document.getElementById("ch-file");

CHAPTERS.forEach((ch, ix) => {
  const a = document.createElement("a");
  a.href = "#" + ch.id;
  a.innerHTML = `<span class="no">${String(ix).padStart(2, "0")}</span>${ch.title}`;
  a.dataset.id = ch.id;
  nav.appendChild(a);
});

function loadChapter(id) {
  const ch = CHAPTERS.find((c) => c.id === id) || CHAPTERS[0];
  const raw = document.getElementById(ch.src).textContent.replace(/<\\\//g, "</");
  chTitle.textContent = ch.title;
  if (ch.file) { chFile.href = ch.file; chFile.textContent = "查看源文件 " + ch.file; chFile.style.display = ""; }
  else { chFile.style.display = "none"; }
  content.innerHTML = mdToHtml(raw);
  nav.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.dataset.id === ch.id));
  window.scrollTo({ top: 0 });
}

content.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (href.startsWith("#") && CHAPTERS.some((c) => c.id === href.slice(1))) {
    e.preventDefault();
    location.hash = href;
  }
});

// 代码块复制按钮
content.addEventListener("click", (e) => {
  const btn = e.target.closest("button.copy");
  if (!btn) return;
  const code = btn.closest(".codeblock").querySelector("code");
  const done = () => { btn.textContent = "已复制"; setTimeout(() => (btn.textContent = "复制"), 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code.textContent).then(done, () => fallbackCopy(code.textContent, done));
  } else fallbackCopy(code.textContent, done);
});
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

window.addEventListener("hashchange", () => loadChapter(location.hash.slice(1) || "intro"));
loadChapter(location.hash.slice(1) || "intro");
</script>
