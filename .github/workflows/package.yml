name: 构建发布（便携版）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # P12 响应式基座：petite-vue vendor 产物（web/lib/vendor/，gitignored，构建期生成）
      - name: 生成 petite-vue vendor 产物
        run: npm run vendor:petite-vue

      - name: 构建 cordis 内核（USE_CORDIS=1 运行依赖）
        run: npm run build:kernel

      - name: 构建前端内核（/web/kernel.js 发布依赖）
        run: npm run build:web

      - name: 构建服务端 bundle（应用 + 生产依赖单文件）
        run: npm run build:server

      # 组装便携目录（bundle 形态：node/ 运行时 + 单文件 app + plugins/ 组件层 +
      # resource/ 数据层），用 runner 的 process.execPath 作为分发的 node/node.exe
      - name: 组装便携包
        run: node scripts/make-portable.js --zip

      - name: 上传构建产物（供手动下载，不点 tag 也可取）
        uses: actions/upload-artifact@v4
        with:
          name: y-stageX-portable
          path: |
            YStage3-Portable.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YStage3-Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
